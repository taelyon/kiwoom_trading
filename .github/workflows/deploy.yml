name: Deploy to Synology NAS

on:
  push:
    branches:
      - main  # 배포를 트리거할 브랜치 지정

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Package (Tarball)
        run: |
          # 불필요한 가상환경, 데이터베이스, 로그, 로컬 설정 파일 등을 제외하고 압축합니다.
          tar -czvf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='data' \
            --exclude='logs' \
            --exclude='.env' \
            --exclude='kiwoom_token.json' \
            --exclude='blacklist.json' \
            --exclude='*.db*' \
            --exclude='*.bak' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            .
          mv /tmp/deploy.tar.gz .

      - name: Copy Tarball to NAS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_PORT }}
          source: "deploy.tar.gz"
          target: ${{ secrets.NAS_PROJECT_PATH }} # 예: /volume1/docker/kiwoom_trading
          rm: false
          proxy_strict_host_key_checking: false

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_PORT }}
          strict_host_key_checking: false
          script: |
            # 1. 프로젝트 폴더로 이동
            cd ${{ secrets.NAS_PROJECT_PATH }}
            
            # 2. 업로드된 압축 파일 풀기 및 정리
            tar -xzvf deploy.tar.gz
            rm deploy.tar.gz
            
            # 3. Docker 컨테이너 재빌드 및 재구동
            sudo docker-compose down --remove-orphans
            sudo docker system prune -f
            sudo docker-compose up -d --force-recreate --build
