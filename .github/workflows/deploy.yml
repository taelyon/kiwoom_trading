name: Deploy to Synology NAS

on:
  push:
    branches:
      - main  # 배포를 트리거할 브랜치 지정

# GHCR에 이미지를 쓸 수 있도록 패키지 권한 설정
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/taelyon/kiwoom_trading:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker-compose.yml 파일만 NAS에 전송하여 설정 업데이트를 동기화합니다.
      - name: Copy docker-compose.yml to NAS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_PORT }}
          source: "docker-compose.yml"
          target: ${{ secrets.NAS_PROJECT_PATH }}
          rm: false

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_PORT }}
          script: |
            # 1. 프로젝트 폴더로 이동
            cd ${{ secrets.NAS_PROJECT_PATH }}
            
            # 2. GHCR에서 최신 이미지 가져오기
            # (주석: 최초 1회 NAS SSH에 접속해 docker login ghcr.io -u taelyon을 해야 함)
            sudo /usr/local/bin/docker-compose pull
            
            # 3. 컨테이너 재구동
            sudo /usr/local/bin/docker-compose up -d --force-recreate
            
            # 4. 사용하지 않는 예전 이미지 정리
            sudo /usr/local/bin/docker image prune -f
